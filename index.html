<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Oficina Mecânica - Login</title>
    <link rel="stylesheet" href="login.css">
</head>

<body>

    <div class="login">

        <div class="logo">
            <img src="Oficina3.png" alt="Logo da Oficina">
        </div>

        <main>
            <h1>Login</h1>

            <form action="paginainicial.html" method="GET">

                <div class="inputGroup">
                    <label for="usuario">Usuário</label>
                    <input type="text" id="usuario" name="usuario"
                        placeholder="Digite seu usuário" required>
                </div>

                <div class="inputGroup">
                    <label for="senha">Senha</label>
                    <input type="password" id="senha" name="senha"
                        placeholder="Digite sua senha" required>
                </div>

                <button type="submit">Entrar</button>

            </form>
            <form action="cadastrocliente.html" method="GET">
                <button type="submit">Cadastrar Novo Cliente</button>
            </form>
        </main>

    </div>

</body>
</html>
