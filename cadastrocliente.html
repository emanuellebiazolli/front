<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Cadastro de Cliente</title>
    <link rel="stylesheet" href="cadastrocliente.css">
</head>
<body>

    <header>
        <img src="Oficina3.png" alt="Logo">
        <nav>
            <ul class="menu-lista">
                <li><a href="paginainicial.html">Página Inicial</a></li>
                <li><a href="cadastrocliente.html" class="ativo">Cadastro Clientes</a></li>
                <li><a href="cadastroveiculo.html">Cadastro Veículos</a></li>
                <li><a href="agendamento.html">Agendamentos</a></li>
                <li><a href="listarcliente.html">Listar clientes</a></li>
                <li><a href="listaragendamento.html">Listar agendamentos</a></li>
                <li><a href="index.html">Sair</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="card">
            <h1>Cadastro de Cliente</h1>

            <form>
                <label for="nome">Nome</label>
                <input type="text" id="nome" name="nome" placeholder="Digite o nome do cliente" required>

                <label for="telefone">Telefone</label>
                <input type="tel" id="telefone" name="telefone" placeholder="Digite o telefone" required>

                <label for="cpf">CPF</label>
                <input type="text" id="cpf" name="cpf" placeholder="Digite o CPF" required>

                <button type="submit">Cadastrar Cliente</button>
            </form>
        </section>
    </main>

</body>
</html>
